/* ===== HUNAR PREMIUM 3D VISUAL LAYER ===== */
:root{
  --h3d-accent:#22c7a0;
  --h3d-accent2:#b98cff;
  --h3d-dark:#070a09;
  --h3d-panel:rgba(255,255,255,.055);
}
body{overflow-x:hidden}
.topbar{
  background:rgba(7,10,9,.82)!important;
  border-bottom:1px solid rgba(255,255,255,.09)!important;
  backdrop-filter:blur(18px);
  box-shadow:0 8px 35px rgba(0,0,0,.18);
}
.topbar .container{position:relative}
.topbar .logo{
  color:#fff!important;
  text-shadow:0 0 24px rgba(34,199,160,.22);
  transition:transform .35s ease,text-shadow .35s ease;
}
.topbar .logo:hover{transform:translateZ(14px) scale(1.03);text-shadow:0 0 34px rgba(34,199,160,.42)}
.topbar .links a{
  color:rgba(255,255,255,.72)!important;
  transition:transform .25s ease,color .25s ease,background .25s ease;
  border:1px solid transparent;
}
.topbar .links a:hover{
  color:#fff!important;
  transform:translateY(-2px);
  background:rgba(255,255,255,.06);
  border-color:rgba(255,255,255,.08);
}
.hero{
  background:
    radial-gradient(circle at 78% 28%,rgba(34,199,160,.13),transparent 27%),
    radial-gradient(circle at 18% 75%,rgba(185,140,255,.10),transparent 28%),
    #070a09!important;
  color:#fff!important;
  min-height:680px;
  padding:92px 0 90px!important;
}
.hero:before,.hero:after{display:none}
.heroGrid{z-index:3}
.hero .eyebrow{color:var(--h3d-accent)!important;letter-spacing:.18em;text-transform:uppercase}
.hero h1{
  color:#fff!important;
  font-size:clamp(52px,7.4vw,104px)!important;
  line-height:.9!important;
  letter-spacing:-.065em!important;
  max-width:820px!important;
  text-shadow:0 12px 50px rgba(0,0,0,.35);
}
.hero p{color:rgba(255,255,255,.68)!important}
.heroVisual{
  min-height:535px!important;
  perspective:1400px!important;
}
.scene{
  inset:0!important;
  border:1px solid rgba(255,255,255,.12)!important;
  border-radius:34px!important;
  background:
    radial-gradient(circle at 70% 30%,rgba(34,199,160,.18),transparent 24%),
    radial-gradient(circle at 25% 75%,rgba(185,140,255,.16),transparent 28%),
    linear-gradient(145deg,#101614,#060908)!important;
  box-shadow:0 35px 100px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)!important;
  transform-style:preserve-3d!important;
  transform:rotateY(-7deg) rotateX(4deg)!important;
}
.sceneGrid{
  opacity:.5;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px)!important;
  background-size:42px 42px!important;
  transform:translateZ(-20px) scale(1.08);
}
.float{
  background:rgba(15,20,18,.76)!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.12)!important;
  box-shadow:0 24px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)!important;
  backdrop-filter:blur(16px);
  transform-style:preserve-3d;
}
.float .muted,.float .miniPrice{color:rgba(255,255,255,.7)!important}
.float.a{transform:translateZ(75px) rotateY(-7deg);animation:h3dFloatA 7s ease-in-out infinite}
.float.b{transform:translateZ(110px) rotateY(8deg);animation:h3dFloatB 8s ease-in-out infinite}

function go(route){
  const next=String(route||'home');
  const current=location.hash.slice(1)||'home';
  if(current===next){ render(next); return; }
  try{
    const stack=JSON.parse(sessionStorage.getItem('hunar_app_history')||'[]');
    const currentRoute=String(current).split('?')[0];
    const nextRoute=String(next).split('?')[0];
    if(current&&current!==next){
      const last=stack[stack.length-1];
      if(last!==current && currentRoute!==nextRoute)stack.push(current);
      sessionStorage.setItem('hunar_app_history',JSON.stringify(stack.slice(-60)));
    }
  }catch(e){}
  // One click = one navigation = one render. Push the URL without firing hashchange,
  // then render immediately. Browser Back/Forward is handled by popstate below.
  history.pushState(null,'',window.location.pathname+window.location.search+'#'+next);
  render(next);
}

async function completeGoogleRole(role){sessionStorage.setItem('hunar_explicit_session','1');

async function sendSignupEmailOtp(role){
  const draft=signupDraft(role),cleanEmail=normalizeEmail(draft.email),password=role==='freelancer'?freelancerSignupSecret:clientSignupSecret;
  if(!cleanEmail)throw new Error('Please enter a valid email address.');
  if(!password||password.length<8)throw new Error('Password must contain at least 8 characters.');
  if(!supabaseClient)throw new Error('Supabase authentication is unavailable.');
  const pendingSameEmail=!!draft.authCreated&&normalizeEmail(draft.authEmail||'')===cleanEmail&&!draft.emailVerified;
  console.log('HUNAR PASSWORD SIGNUP EMAIL:',cleanEmail,{pendingSameEmail});
  let resumedExistingAuth=false;

  if(!pendingSameEmail){
    let signupData=null,signupError=null;
    try{
      const result=await supabaseClient.auth.signUp({email:cleanEmail,password,options:{data:{role,full_name:draft.name,phone:draft.phone||null,hunar_signup_status:'incomplete',hunar_signup_role:role}}});
      signupData=result.data;signupError=result.error;
    }catch(error){signupError=error}

    const duplicateIdentity=!!signupData?.user?.identities&&signupData.user.identities.length===0;
    const alreadyExists=!!signupError&&/already registered|already exists|user already registered/i.test(String(signupError.message||signupError));
    if(signupError&&!alreadyExists){console.error('HUNAR PASSWORD SIGNUP ERROR:',signupError);throw signupError;}

    if(alreadyExists||duplicateIdentity){
      // A Supabase Auth user can exist even when the HUNAR application/profile
      // was never completed. Authenticate the owner, inspect HUNAR completion,
      // and resume instead of falsely reporting a completed account.
      let resumed=false;
      try{
        const loginResult=await supabaseClient.auth.signInWithPassword({email:cleanEmail,password});
        if(loginResult.error)throw loginResult.error;
        if(!loginResult.data?.user)throw new Error('The existing signup could not be resumed.');
        const state=await getHunarOnboardingState(loginResult.data.user,role);
        if(state.complete){
          await supabaseClient.auth.signOut();
          const e=new Error('An account already exists with this email. Please sign in instead.');e.code='HUNAR_ACCOUNT_EXISTS';throw e;
        }
        resumed=true;
      }catch(resumeError){
        if(resumeError?.code==='HUNAR_ACCOUNT_EXISTS')throw resumeError;
        // If the Auth user is still unconfirmed, password sign-in may fail.
        // We can still send the email OTP; ownership will be proven by that code.
        const raw=String(resumeError?.message||resumeError||'').toLowerCase();
        if(!raw.includes('email not confirmed')&&!raw.includes('email_not_confirmed')&&!raw.includes('invalid login credentials')&&!raw.includes('invalid password')){
          console.error('HUNAR incomplete signup resume check:',resumeError);
          throw resumeError;
        }
        console.warn('HUNAR existing incomplete signup will resume through email OTP:',resumeError?.message||resumeError);
      }
      resumedExistingAuth=true;
      draft.authCreated=true;draft.authEmail=cleanEmail;draft.resumedExistingAuth=true;
      console.log('HUNAR RESUMING INCOMPLETE AUTH SIGNUP:',cleanEmail,{resumed});
    }else{
      draft.authCreated=true;draft.authEmail=cleanEmail;draft.resumedExistingAuth=false;
      await markAuthSignupStatus('incomplete',role);
    }
  }else{
    console.log('HUNAR RESUMING INCOMPLETE SIGNUP:',cleanEmail);
  }

  console.log('HUNAR EMAIL OTP REQUEST EMAIL:',cleanEmail);
  const otp=await supabaseClient.auth.signInWithOtp({email:cleanEmail,options:{shouldCreateUser:false}});
  if(otp.error){console.error('HUNAR OTP REQUEST ERROR:',otp.error);throw otp.error;}
  draft.email=cleanEmail;draft.authCreated=true;draft.authEmail=cleanEmail;draft.resumedExistingAuth=!!(draft.resumedExistingAuth||resumedExistingAuth);saveSignupDraft(role,draft);sessionStorage.setItem('hunar_explicit_session','1');
  hunarEmailResendUntil=Date.now()+60000;
  return otp.data;
}
async function resendSignupEmail(role){const el=document.getElementById('emailConfirmStatus');if(hunarEmailResendUntil>Date.now()){updateEmailResendCountdown();if(el)el.textContent='Please wait until the 60-second countdown finishes before requesting another code.';return}const draft=signupDraft(role),cleanEmail=normalizeEmail(draft.email);if(!cleanEmail){if(el)el.textContent='Your verification email is missing. Please restart signup.';return}try{const {data,error}=await supabaseClient.auth.signInWithOtp({email:cleanEmail,options:{shouldCreateUser:false}});if(error)throw error;if(data?.user){productionUser=data.user;window.productionUser=data.user}hunarEmailResendUntil=Date.now()+60000;if(el)el.textContent='A new 6-digit verification code was sent.';updateEmailResendCountdown()}catch(err){console.error('HUNAR email OTP resend:',err);if(el)el.textContent=authErrorMessage(err,'The verification code could not be sent. Please try again.')}}
async function verifySignupEmail(e,role){
  e.preventDefault();
  if(hunarEmailVerifyInFlight)return;
  const form=e.target,
        draft=signupDraft(role),
        cleanEmail=String(draft.email||'').trim().toLowerCase(),
        cleanToken=String(new FormData(form).get('token')||'').trim(),
        status=document.getElementById('emailConfirmStatus'),
        submit=form.querySelector('button[type="submit"]');
  if(!/^\d{6}$/.test(cleanToken)){
    if(status)status.textContent='Enter the 6-digit verification code.';
    return;
  }
  if(!cleanEmail){
    if(status)status.textContent='Your verification email is missing. Please restart signup.';
    return;
  }
  if(!supabaseClient){
    if(status)status.textContent='Hunar authentication is unavailable. Please try again.';
    return;
  }
  hunarEmailVerifyInFlight=true;
  hunarSignupEmailVerificationInProgress=true;
  hunarSignupEmailVerificationHandled=false;
  if(submit)submit.disabled=true;
  console.log('HUNAR OTP VERIFY TOKEN LENGTH:',cleanToken.length);
  try{
    const {data,error}=await supabaseClient.auth.verifyOtp({
      email:cleanEmail,
      token:cleanToken,
      type:'email'
    });
    if(error){
      console.error('HUNAR OTP VERIFY ERROR', {message:error?.message,code:error?.code,status:error?.status,name:error?.name});
      if(status)status.textContent=authErrorMessage(error,'Incorrect verification code. Please try again.');
      return;
    }
    console.log('HUNAR OTP VERIFIED SUCCESSFULLY');
    const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError)throw sessionError;
    if(!sessionData.session?.user)throw new Error('No authenticated Supabase session was returned after email verification.');

    draft.email=cleanEmail;
    draft.emailVerified=true;
    draft.authCreated=true;
    if(draft.resumedExistingAuth){
      const password=role==='freelancer'?freelancerSignupSecret:clientSignupSecret;
      if(password&&password.length>=8){
        const {error:passwordError}=await supabaseClient.auth.updateUser({password});
        if(passwordError)throw passwordError;
      }
    }
    await markAuthSignupStatus('incomplete',role);
    saveSignupDraft(role,draft);

    // IMPORTANT: email OTP verification proves ownership, but it must NOT create
    // the HUNAR application account/profile yet. The account is created only
    // after the final onboarding step. Keep the authenticated Supabase session
    // temporarily so the user can continue the 9-step registration.
    productionUser=sessionData.session.user;
    window.productionUser=sessionData.session.user;
    me={id:sessionData.session.user.id,role,email:cleanEmail,phone:draft.phone||'',emailVerified:true,phoneVerified:false};
    hunarSignupEmailVerificationHandled=true;
    if(role==='freelancer'&&window.hunarPendingFreelancerPhoto){
      const path=sessionData.session.user.id+'/'+crypto.randomUUID()+'.'+window.hunarPendingFreelancerPhoto.name.split('.').pop().toLowerCase();
      const up=await HunarData.storage.upload('hunar-avatars',path,window.hunarPendingFreelancerPhoto);
      draft.photo=up.publicUrl||draft.photo;
      window.hunarPendingFreelancerPhoto=null;
      saveSignupDraft(role,draft);
    }
    hunarEmailResendUntil=0;
    if(hunarEmailCountdownTimer){clearTimeout(hunarEmailCountdownTimer);hunarEmailCountdownTimer=null}
    if(status)status.textContent='Email verified successfully.';
    go('register?role='+role+'&step=3');
  }catch(err){
    console.error('HUNAR OTP VERIFY ERROR:',err);
    if(status)status.textContent=authErrorMessage(err,'Email verification could not be completed. Please try again.');
  }finally{
    hunarEmailVerifyInFlight=false;
    hunarSignupEmailVerificationInProgress=false;
    if(submit)submit.disabled=false;
  }
}

ity verification can be completed later from your dashboard.</p></div>${stepper(labels,8)}<div class="card"><div class="success">✓ Your freelancer registration is ready.</div><div class="notice" style="margin-top:12px">Identity verification is not part of registration. Open it later from your dashboard when you are ready to submit your ID and selfie.</div><button class="btn primary" style="margin-top:16px" onclick="finishFreelancer()">Enter Freelancer Dashboard →</button></div></div></section>`;}catch(error){console.error('HUNAR freelancerStep ERROR:',{step,error});throw error}}

|draft.photo;window.hunarPendingFreelancerPhoto=null}}catch(err){console.error('HUNAR freelancer photo upload:',err);return alert(authMessage(err,'The profile photo could not be uploaded. Please try again.'))}if(!draft.photo)return alert('A profile photo is required. Please upload a photo.');draft.professionalComplete=true;saveSignupDraft('freelancer',draft);go('register?role=freelancer&step=4');return}if(step===4){draft.skills=[...new Set([...f.getAll('skills'),...String(f.get('customSkills')||'').split(',').map(x=>x.trim()).filter(Boolean)])];if(!draft.skills.length)return alert('Select or add at least one skill.');draft.skillsComplete=true;saveSignupDraft('freelancer',draft);go('register?role=freelancer&step=5');return}if(step===5){if(!draft.experience||!draft.clientTypes||!draft.projectTypes||!draft.strongest||!draft.tools||!draft.expectations||!draft.certificates)return alert('Please complete every required experience field.');draft.experienceComplete=true;saveSignupDraft('freelancer',draft);go('register?role=freelancer&step=6');return}if(step===6){if(!draft.serviceTitle||!draft.serviceCategory||!draft.serviceDescription||!draft.servicePrice||!draft.delivery)return alert('Please complete every required service field.');try{if(window.hunarPendingServiceImage){const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError||!sessionData.session?.user)throw new Error('No authenticated Supabase session is available.');const path=sessionData.session.user.id+'/'+crypto.randomUUID()+'.'+window.hunarPendingServiceImage.name.split('.').pop().toLowerCase();const up=await HunarData.storage.upload('hunar-portfolios',path,window.hunarPendingServiceImage);draft.serviceImage=up.publicUrl||draft.serviceImage;window.hunarPendingServiceImage=null}}catch(err){console.error('HUNAR service image upload:',err);return alert(authMessage(err,'The service image could not be uploaded. Please try again.'))}draft.serviceComplete=true;saveSignupDraft('freelancer',draft);go('register?role=freelancer&step=7');return}if(step===7){if(!draft.portfolioTitle||!draft.portfolioDescription||!draft.portfolioTools||!draft.portfolioRole||(!draft.portfolioImage&&!window.hunarPendingPortfolioImage))return alert('Please complete the required portfolio information and add a project image.');try{if(window.hunarPendingPortfolioImage){const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError||!sessionData.session?.user)throw new Error('No authenticated Supabase session is available.');const path=sessionData.session.user.id+'/'+crypto.randomUUID()+'.'+window.hunarPendingPortfolioImage.name.split('.').pop().toLowerCase();const up=await HunarData.storage.upload('hunar-portfolios',path,window.hunarPendingPortfolioImage);draft.portfolioImage=up.publicUrl||draft.portfolioImage;window.hunarPendingPortfolioImage=null}}catch(err){console.error('HUNAR portfolio upload:',err);return alert(authMessage(err,'The portfolio image could not be uploaded. Please try again.'))}draft.portfolioComplete=true;saveSignupDraft('freelancer',draft);go('register?role=freelancer&step=8');return}if(step===8){if(!draft.legalName||!draft.idType||!draft.idRef)return alert('Please complete the identity verification information.');draft.identityComplete=true;saveSignupDraft('freelancer',draft);go('register?role=freelancer&step=9');return}}

async function finishFreelancer(){const draft=JSON.parse(sessionStorage.getItem('hunar_freelancer_draft')||'{}');if(!draft.emailVerified){alert('Please complete email verification first.');return}if(!draft.photo&&!window.hunarPendingFreelancerPhoto){alert('A profile photo is required.');return}if(!draft.portfolioImage&&!window.hunarPendingPortfolioImage){alert('A portfolio image or screenshot is required.');return}try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(!data.session?.user)throw new Error('Missing authenticated session.');productionUser=data.session.user;window.productionUser=data.session.user;const a=await finishAuthenticatedUser(data.session.user,'freelancer',{requireFreelancerProfile:false,sync:false});let photoUrl=draft.photo||null;if(window.hunarPendingFreelancerPhoto){const path=a.id+'/'+crypto.randomUUID()+'.'+window.hunarPendingFreelancerPhoto.name.split('.').pop().toLowerCase();photoUrl=(await HunarData.storage.upload('hunar-avatars',path,window.hunarPendingFreelancerPhoto)).publicUrl||photoUrl}let portfolioUrl=draft.portfolioImage||null;if(window.hunarPendingPortfolioImage){const path=a.id+'/'+crypto.randomUUID()+'.'+window.hunarPendingPortfolioImage.name.split('.').pop().toLowerCase();portfolioUrl=(await HunarData.storage.upload('hunar-portfolios',path,window.hunarPendingPortfolioImage)).publicUrl||portfolioUrl}await HunarData.accounts.update({full_name:draft.name,phone:draft.phone,city:draft.city,region:draft.region,photo_url:photoUrl,bio:draft.bio});await HunarData.onboarding.freelancer({full_name:draft.name,phone:draft.phone,city:draft.city,region:draft.region,photo_url:photoUrl,bio:draft.bio,professional_title:draft.title,profession:draft.profession,experience:draft.experience,availability:draft.availability,starting_price_etb:Number(draft.price||0),languages:String(draft.languages||'').split(',').map(x=>x.trim()).filter(Boolean),categories:draft.cats||[],skills:draft.skills||[],certificates:String(draft.certificates||'').split(',').map(x=>x.trim()).filter(Boolean),service_title:draft.serviceTitle,service_category:draft.serviceCategory,service_description:draft.serviceDescription,service_price_etb:Number(draft.servicePrice||draft.price||0),service_delivery_days:Number(draft.delivery||7),service_revisions:Number(draft.revisions||0),service_includes:String(draft.includes||'').split(',').map(x=>x.trim()).filter(Boolean),service_image_url:draft.serviceImage||null,portfolio_title:draft.portfolioTitle,portfolio_description:draft.portfolioDescription,portfolio_category:draft.portfolioCategory||draft.serviceCategory,portfolio_tools:String(draft.portfolioTools||'').split(',').map(x=>x.trim()).filter(Boolean),portfolio_role:draft.portfolioRole,portfolio_year:Number(draft.portfolioYear||new Date().getFullYear()),portfolio_url:draft.portfolioUrl||null,portfolio_image_url:portfolioUrl});const createdProfile=await HunarData.freelancers.profile();if(!createdProfile?.account_id||createdProfile.account_id!==a.id)throw new Error('Freelancer onboarding completed but the freelancer profile could not be found for this account.');await syncProductionData();await markAuthSignupStatus('complete','freelancer');me={id:a.id,role:'freelancer',email:a.email||data.session.user.email,phone:draft.phone,emailVerified:true,phoneVerified:a.phone_verified};sessionStorage.removeItem('hunar_freelancer_draft');sessionStorage.removeItem('hunar_signup_role');sessionStorage.setItem('hunar_explicit_session','1');freelancerSignupSecret='';window.hunarPendingFreelancerPhoto=null;window.hunarPendingPortfolioImage=null;go('dashboard')}catch(err){console.error('Freelancer finish:',err);alert(authErrorMessage(err,'Your freelancer profile could not be completed. Please try again.'))}}

function signin(){const params=new URLSearchParams(location.hash.split('?')[1]||''),role=params.get('role');if(!['freelancer','client'].includes(role))return `<section class="authWrap"><div class="auth"><div class="authHead"><span class="tag">WELCOME BACK</span><h1>Sign in to Hunar</h1><p class="muted">First choose how you want to use Hunar. Then we will ask for your email and password.</p></div><div class="signinChoiceGrid"><div class="signinChoice"><span class="signinRoleIcon">✦</span><h2>Freelancer</h2><p>Find jobs, manage services, applications, portfolio and performance.</p><button class="btn primary" type="button" onclick="go('signin?role=freelancer')">Continue as Freelancer →</button></div><div class="signinChoice"><span class="signinRoleIcon">⌂</span><h2>Client</h2><p>Find freelancers, post projects and manage your client workspace.</p><button class="btn primary" type="button" onclick="go('signin?role=client')">Continue as Client →</button></div></div><div style="text-align:center;margin-top:18px">New to Hunar? <button class="btn outline" onclick="go('signup')">Create account</button></div></div></section>`;const title=role==='freelancer'?'Freelancer':'Client';const desc=role==='freelancer'?'Find jobs, manage services, applications and performance.':'Hire freelancers, post projects and manage your client workspace.';return `<section class="authWrap"><div class="auth"><div class="authHead"><span class="tag">${title.toUpperCase()} SIGN IN</span><h1>Sign in as ${title}</h1><p class="muted">${desc}</p></div><form class="card signinCard" onsubmit="login(event)"><input type="hidden" name="role" value="${role}"><div class="notice" style="margin-bottom:16px"><b>Signing in as ${title}</b><br><span class="muted">This selection must match the role of your existing Hunar account.</span></div><div class="field"><label>Email</label><input name="email" required type="email" autocomplete="email"></div><div class="field"><label>Password</label><input name="password" required type="password" autocomplete="current-password"></div><button class="btn primary">Sign In →</button><button type="button" class="btn outline" style="width:100%;margin-top:10px" onclick="startGoogle('${role}')">Continue with Google</button><button type="button" class="btn ghost" style="width:100%;margin-top:10px" onclick="go('forgot-password')">Forgot password?</button><button type="button" class="btn outline signinBack" onclick="go('signin')">← Change account type</button></form><div style="text-align:center;margin-top:18px">New to Hunar? <button class="btn outline" onclick="go('signup')">Create account</button></div></div></section>`}
async function sendReset(e){e.preventDefault();if(!supabaseClient){alert('Hunar authentication is not configured correctly yet.');return}let email=normalizeEmail(new FormData(e.target).get('email'));try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname+'#reset-password'});if(error)throw error;alert('If an account exists for that email, a secure password-reset link has been sent.');}catch(err){console.error(err);alert(authMessage(err,'Authentication is temporarily unavailable. Please check your connection and try again.'))}}
async function applyReset(e){e.preventDefault();let f=new FormData(e.target),password=String(f.get('password')||''),confirm=String(f.get('confirm')||'');if(password.length<8){alert('Password must contain at least 8 characters.');return}if(password!==confirm){alert('Passwords do not match.');return}try{const {error}=await supabaseClient.auth.updateUser({password});if(error)throw error;alert('Password updated successfully.');go('dashboard')}catch(err){console.error(err);alert(authMessage(err,'Password could not be updated. Please request a new reset link.'))}}
async function login(e){
  e.preventDefault();
  const f=new FormData(e.target),email=normalizeEmail(f.get('email')),password=String(f.get('password')||''),requestedRole=String(f.get('role')||'freelancer');
  if(!['freelancer','client'].includes(requestedRole))requestedRole='freelancer';
  if(password.length<8){alert('Password must contain at least 8 characters.');return}
  if(!supabaseClient){alert('Hunar authentication is not configured correctly yet.');return}
  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.user)throw new Error('Authentication did not return a user.');
    sessionStorage.setItem('hunar_explicit_session','1');
    const state=await getHunarOnboardingState(data.user,requestedRole);
    if(!state.complete){
      const role=state.role||requestedRole;
      await supabaseClient.auth.signOut();productionUser=null;window.productionUser=null;me=null;
      const draft=signupDraft(role);draft.email=email;draft.authCreated=true;draft.authEmail=email;draft.emailVerified=!!data.user.email_confirmed_at;draft.resumedExistingAuth=true;saveSignupDraft(role,draft);
      alert('Your HUNAR registration is not finished yet. You cannot sign in until your profile is completed. We will return you to the registration steps so you can continue.');
      go('register?role='+role+'&step='+(draft.emailVerified?3:2));
      return;
    }
    const account=state.account;
    if(account?.role!==requestedRole){await supabaseClient.auth.signOut();productionUser=null;window.productionUser=null;me=null;alert('This email is registered as a '+(account?.role==='freelancer'?'Freelancer':'Client')+'. Please choose the correct sign-in type.');nav();return;}
    await finishAuthenticatedUser(data.user,null,{sync:true});
    go('dashboard');
  }catch(err){
    console.error('Login:',err);
    const raw=String(err?.message||err||'').toLowerCase();
    if(raw.includes('email not confirmed')||raw.includes('email_not_confirmed')){
      try{
        const otp=await supabaseClient.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(otp.error)throw otp.error;
        sessionStorage.setItem('hunar_signup_role',requestedRole);const draft=signupDraft(requestedRole);draft.email=email;draft.authCreated=true;draft.authEmail=email;draft.resumedExistingAuth=true;saveSignupDraft(requestedRole,draft);hunarEmailResendUntil=Date.now()+60000;go('register?role='+requestedRole+'&step=2');return;
      }catch(resendErr){console.error('HUNAR unverified sign-in OTP request:',resendErr);}
    }
    alert(authMessage(err,'Unable to sign in. Please check your connection and try again.'))
  }
}
async function logout(){try{if(window.HunarData?.realtime)HunarData.realtime.unsubscribe();if(supabaseClient)await supabaseClient.auth.signOut()}finally{productionUser=null;window.productionUser=null;me=null;clientSignupSecret='';freelancerSignupSecret='';window.hunarPendingClientPhoto=null;window.hunarPendingFreelancerPhoto=null;window.hunarPendingPortfolioImage=null;window.hunarPendingServiceImage=null;sessionStorage.removeItem('hunar_client_draft');sessionStorage.removeItem('hunar_freelancer_draft');sessionStorage.removeItem('hunar_google_role_intent');sessionStorage.removeItem('hunar_explicit_session');go('home')}}
function isUuid(value){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value||''))}
function demoSavedList(){try{return JSON.parse(localStorage.getItem('hunar_demo_saved')||'[]').filter(Boolean)}catch(e){return []}}
function setDemoSavedList(list){localStorage.setItem('hunar_demo_saved',JSON.stringify([...new Set(list)]))}
function isSavedFreelancer(id){return S.saved.includes(id)||demoSavedList().includes(id)}
async function saveDev(id){
  if(!me){go('signin?role=client');return}
  if(me.role!=='client'){alert('Saving freelancers is available from a client account.');return}
  if(!id){return}
  try{
    if(!isUuid(id)){
      const list=demoSavedList();
      const next=list.includes(id)?list.filter(x=>x!==id):[...list,id];
      localStorage.setItem('hunar_demo_saved',JSON.stringify(next));
      render(location.hash.slice(1)||'home');
      return;
    }
    const saved=await HunarData.saved.toggle(id);
    try{S.saved=await HunarData.saved.list();}catch(e){S.saved=[];}
    render(location.hash.slice(1)||'home');
  }catch(err){console.error('Save freelancer:',err);alert(err.message||'The freelancer could not be saved.');}
}
function messageDev(uid){if(!me){go('signin?role=client');return}if(me.role!=='client'){alert('Only a client can start a freelancer conversation.');return}if(!uid){alert('This freelancer cannot be contacted because the profile has no account ID.');return}if(!isUuid(uid)){alert('This demonstration profile cannot receive a live message. Choose a registered freelancer profile.');return}go('messages?compose='+encodeURIComponent(uid))}
function messagePolicyViolation(body){const text=String(body||'').trim();const patterns=[/\b(?:\+?\d[\d\s().-]{7,}\d)\b/i,/\b(?:whatsapp|telegram|signal|viber|wechat|facebook|instagram|tiktok|snapchat)\b/i,/@[a-z0-9._-]{2,}/i,/\b(?:email|e-mail)\s*[:=]?\s*[^\s]+@[^\s]+/i,/\b[^\s@]+@[^\s@]+\.[a-z]{2,}\b/i,/https?:\/\//i,/\b(?:street|st\.|road|rd\.|avenue|ave\.|house number|home address|address)\b/i];return patterns.some(r=>r.test(text))?'For safety, Hunar cannot send messages containing phone numbers, personal email addresses, usernames/handles, social-media contacts, addresses, or outside-Hunar contact instructions. Remove the contact information and send the professional message again.':''}
async function sendNewMessage(e){e.preventDefault();const form=e.target,fd=new FormData(form),to=String(fd.get('to')||'').trim(),body=String(fd.get('body')||'').trim(),status=document.getElementById('newMessageStatus');if(!to||!body){if(status)status.textContent='Choose a recipient and write a message.';return}const violation=messagePolicyViolation(body);if(violation){if(status){status.className='policyWarning';status.textContent=violation}return}if(!isUuid(to)){if(status)status.textContent='Choose a registered Hunar member.';return}if(!productionUser){if(status)status.textContent='Please sign in with a real Hunar account.';return}try{if(status){status.className='notice';status.textContent='Sending…'}await HunarData.messaging.send(to,body);await syncProductionData();go('messages')}catch(err){console.error('HUNAR new message:',err);if(status)status.textContent=err.message||'Message could not be sent. Please try again.'}}
function newMessage(){if(!me){go('signin');return ''}const qs=new URLSearchParams(location.hash.split('?')[1]||''),pre=qs.get('to')||'';const candidates=(S.users||[]).filter(u=>u.id!==me.id&&u.role&&(me.role==='client'?u.role==='freelancer':u.role==='client'));const profiles=publicFreelancers();if(me.role==='client')profiles.forEach(d=>{if(d.id&&isUuid(d.id)&&d.id!==me.id&&!candidates.some(x=>x.id===d.id))candidates.push({id:d.id,n:d.n||d.name||'Freelancer',email:'',role:'freelancer'})});return `<section class="section pageEnter"><div class="container"><div class="newMessageCard"><div class="newMessageHero"><span class="tag">MESSAGE</span><h1 style="margin:9px 0 5px">New message</h1><p class="muted">Choose a person, write your message, and send.</p></div><form class="card" onsubmit="sendNewMessage(event)"><div class="field"><label>To</label><select name="to" required><option value="">Choose a person</option>${candidates.map(u=>`<option value="${esc(u.id)}" ${u.id===pre?'selected':''}>${esc(u.n||u.email||'Hunar member')} · ${esc(u.role==='freelancer'?'Freelancer':'Client')}</option>`).join('')}</select></div><div class="field"><label>Message</label><textarea name="body" required minlength="2" maxlength="4000" placeholder="Write your message…"></textarea></div><div id="newMessageStatus" class="notice">Keep communication professional. HUNAR protects users by keeping personal contact details out of marketplace messages. <button type="button" class="textAction" onclick="go('policy')">Read policy →</button></div><div class="actions"><button class="btn primary" type="submit">Send</button><button class="btn outline" type="button" onclick="go('messages')">Cancel</button></div></form></div></div></section>`}

  const sentCount=thread.filter(m=>String(m.from)===String(me.id)).length;

        <div class="inboxTabs"><button class="active" type="button">All</button><button type="button" onclick="alert('Unread filter is not available in the current message data.')">Unread</button><button type="button" onclick="alert('Favorites are not available in the current message data.')">Favorites</button></div>

        <div id="messageConversationList" class="conversationList">${grouped.map(m=>{const other=String(m.from===me.id?(m.to||''):(m.from||'')),nm=nameOf(other);return `<button class="conversationRow ${other===withId?'selected':''}" type="button" data-name="${esc(nm.toLowerCase())}" onclick="go('messages?with=${encodeURIComponent(other)}')"><div class="messageAvatar">${esc(initials(nm))}</div><div class="conversationCopy"><div class="conversationName"><b>${esc(nm)}</b><small>${esc(fmtTime(m.at))}</small></div><p>${esc(String(m.text||m.body||'').slice(0,74))}${String(m.text||m.body||'').length>74?'…':''}</p></div></button>`}).join('')||'<div class="messageEmpty"><b>Your inbox is empty.</b><span>Start a professional conversation with a HUNAR member.</span></div>'}</div>
      </aside>
      <main class="messageConversation card">
        ${withId?`<div class="conversationHeader"><div class="conversationPerson"><div class="messageAvatar large">${esc(initials(otherName))}</div><div><span class="eyebrowSmall">DIRECT CONVERSATION</span><h2>${esc(otherName)}</h2><span class="muted">HUNAR member · Professional communication</span></div></div><div class="conversationHeaderActions">${contactButton}<button class="iconBtn" type="button" onclick="go('messages')" aria-label="Close conversation">×</button></div></div><div class="conversationBody">${thread.map(m=>`<div class="msgRow ${String(m.from)===String(me.id)?'outgoing':'incoming'}"><div class="threadBubble"><p>${esc(m.text||m.body||'')}</p><small>${esc(fmtTime(m.at))}</small></div></div>`).join('')||'<div class="threadNoMessages">No messages in this conversation yet.</div>'}</div><form class="threadComposer" onsubmit="sendNewMessage(event)"><input type="hidden" name="to" value="${esc(withId)}"><textarea name="body" required minlength="2" maxlength="4000" placeholder="Write a message…"></textarea><div class="composerBottom"><span class="muted">Keep communication professional. Never share passwords or OTP codes.</span><button class="btn primary" type="submit">Send</button></div><div id="newMessageStatus" class="notice">${sentCount+receivedCount} message${sentCount+receivedCount===1?'':'s'} in this conversation.</div></form>`
        composeId?`<div class="conversationHeader"><div class="conversationPerson"><div class="messageAvatar large">${esc(initials(nameOf(composeId)))}</div><div><span class="eyebrowSmall">NEW CONVERSATION</span><h2>${esc(nameOf(composeId))}</h2><span class="muted">${me.role==='client'?'Freelancer':'HUNAR member'} · Message Center</span></div></div><div class="conversationHeaderActions"><button class="iconBtn" type="button" onclick="go('messages')" aria-label="Close composer">×</button></div></div><div class="conversationBody"><div class="threadNoMessages">Start the conversation here. Your message will be sent through the HUNAR Message Center.</div></div><form class="threadComposer" onsubmit="sendNewMessage(event)"><input type="hidden" name="to" value="${esc(composeId)}"><textarea name="body" required minlength="2" maxlength="4000" placeholder="Write a message…"></textarea><div class="composerBottom"><span class="muted">Keep communication professional. Never share passwords or OTP codes.</span><button class="btn primary" type="submit">Send</button></div><div id="newMessageStatus" class="notice">New message to ${esc(nameOf(composeId))}.</div></form>`:
        `<div class="messageWelcome"><div class="welcomeOrb"><span>H</span></div><span class="eyebrowSmall">HUNAR MESSAGE CENTER</span><h2>Your conversations</h2><p class="muted">Select a conversation from the inbox to continue where you left off. Your messages remain connected to the real HUNAR messaging system.</p><button class="btn primary" type="button" onclick="go('new-message')">Start a Conversation</button></div>`}

    </div>
  </div></section>`
}

function identityVerification(){
 if(!me){go('signin');return ''}
 const v=S.verifications.find(x=>x.uid===me.id)||null;
 const status=v?.status||'not_started';
 const statusLabel=status==='approved'?'Verified':status==='pending'?'Under review':status==='rejected'?'Needs correction':'Not started';
 const reason=v?.reason&&String(v.reason).replace(/^\[HUNAR_EKYC_FILES\].*$/,'').trim();
 return `<section class="section pageEnter"><div class="container narrow"><div class="authHead"><span class="tag">SAFETY & SECURITY</span><h1>Identity verification</h1><p class="sectionLead">Verify your identity with a government ID and a selfie. This is separate from your email OTP verification and is reviewed by HUNAR.</p></div><div class="card" style="margin-bottom:16px"><div class="row"><div><b>Current status</b><p class="muted" style="margin:4px 0 0">${esc(statusLabel)}</p></div><span class="badge">${esc(statusLabel)}</span></div>${reason?`<div class="notice" style="margin-top:14px"><b>Review note</b><br>${esc(reason)}</div>`:''}</div>${status==='pending'||status==='approved'?`<div class="card"><h2>${status==='approved'?'Your identity is verified.':'Your verification is under review.'}</h2><p class="muted">${status==='approved'?'Your government ID and selfie review has been approved. No new submission is needed.':'HUNAR will review the submitted information. You do not need to submit it again while this review is pending.'}</p><div class="actions"><button class="btn outline" onclick="go('account')">Back to Account</button><button class="btn primary" onclick="go('profile')">Open Profile</button></div></div>`:`<form class="card" onsubmit="submitIdentityVerification(event)"><div class="field"><label>Legal name</label><input name="legalName" required value="${esc(v?.legalName||S.users.find(x=>x.id===me.id)?.n||'')}" autocomplete="name"></div><div class="field"><label>Government ID type</label><select name="idType" required><option value="">Choose ID type</option>${['National ID','Passport','Driver’s License','Other government ID'].map(x=>`<option ${v?.idType===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Government ID document</label><input name="document" type="file" accept="image/jpeg,image/png,application/pdf" capture="environment" required><small class="muted">JPG, PNG, or PDF. Maximum 10 MB.</small><div class="identityCaptureHint"><span>📷 Camera</span><span>Upload photo</span></div></div><div class="field"><label>Selfie</label><input name="selfie" type="file" accept="image/jpeg,image/png" capture="user" required><small class="muted">Use a clear recent selfie. Maximum 10 MB.</small><div class="identityCaptureHint"><span>🤳 Front camera</span><span>Upload photo</span></div></div><label class="switchRow" style="margin:12px 0"><span><b>I consent to identity review</b><small>I understand HUNAR will use these documents for identity and safety review.</small></span><input type="checkbox" name="consent" required></label><div id="identityStatus" class="notice">Your documents stay private and are reviewed for identity verification.</div><div class="actions"><button class="btn primary" type="submit">Submit Identity Verification</button><button class="btn outline" type="button" onclick="go('account')">Cancel</button></div></form>`}</div></section>`;
}
async function submitIdentityVerification(e){
 e.preventDefault();
 if(!me||!productionUser){go('signin');return}
 const f=new FormData(e.target),status=document.getElementById('identityStatus'),doc=f.get('document'),selfie=f.get('selfie');
 if(!doc||!selfie){if(status)status.textContent='Please upload both your government ID and selfie.';return}
 const button=e.target.querySelector('button[type="submit"]');if(button)button.disabled=true;
 try{
   const legalName=String(f.get('legalName')||'').trim(),idType=String(f.get('idType')||'').trim();
   const req=await HunarData.verification.submit({legalName,idType});
   await HunarData.verification.attachFiles(req.id,doc,selfie);
   await syncProductionData();
   alert('Identity verification submitted. HUNAR will review your documents.');
   go('identity-verification');
 }catch(err){console.error('HUNAR identity verification:',err);if(status)status.textContent=err.message||'Identity verification could not be submitted. Please try again.';if(button)button.disabled=false;}
}

function policy(){return `<section class="section pageEnter"><div class="container policyShell"><div class="policyHero"><div><span class="tag">HUNAR POLICY CENTER</span><h1>Policies that keep HUNAR professional and safe.</h1><p class="sectionLead">These rules apply to clients, freelancers, and anyone using HUNAR. They explain expected conduct, privacy, communication, projects, applications, identity, content, and account security.</p></div><div class="policySeal"><b>H</b><span>TRUST<br>STANDARD</span></div></div><div class="policyNav"><a href="#community">Community</a><a href="#accounts">Accounts</a><a href="#work">Work & Projects</a><a href="#messages-policy">Messaging</a><a href="#identity">Identity</a><a href="#privacy">Privacy</a><a href="#content">Content</a><a href="#security">Security</a><a href="#reviews">Reviews</a><a href="#enforcement">Enforcement</a></div><div class="policyGrid"><article class="policyCard" id="community"><span class="panelKicker">01 · COMMUNITY</span><h2>Community Standards</h2><ul><li>Treat other members respectfully and professionally.</li><li>No harassment, threats, hate, discrimination, intimidation, or abusive behavior.</li><li>Do not impersonate another person, business, or organization.</li><li>Do not use HUNAR to facilitate illegal activity or fraud.</li></ul></article><article class="policyCard" id="accounts"><span class="panelKicker">02 · ACCOUNTS</span><h2>Account & Registration Policy</h2><ul><li>Use accurate information when creating your HUNAR account.</li><li>One completed HUNAR account is allowed per email address.</li><li>Do not share your password or authentication codes.</li><li>Incomplete registration must be finished before the HUNAR profile is treated as complete.</li></ul></article><article class="policyCard" id="work"><span class="panelKicker">03 · WORK</span><h2>Projects, Jobs & Applications</h2><ul><li>Clients create projects and opportunities; freelancers browse and apply.</li><li>Do not submit misleading proposals or promise work you cannot deliver.</li><li>Keep scope, deliverables, timeline, price, and revisions clear.</li><li>Do not spam applications or intentionally submit irrelevant proposals.</li></ul></article><article class="policyCard" id="messages-policy"><span class="panelKicker">04 · MESSAGING</span><h2>Messaging & Contact Information</h2><ul><li>Keep HUNAR conversations focused on professional work.</li><li>Do not share or request personal phone numbers, personal email addresses, social handles, home addresses, or instructions designed to move communication outside HUNAR.</li><li>Never send passwords, OTP codes, authentication links, or private security information.</li><li>Messages may be blocked when they contain prohibited contact information.</li></ul></article><article class="policyCard" id="identity"><span class="panelKicker">05 · IDENTITY</span><h2>Identity Verification Policy</h2><ul><li>Identity verification is separate from email verification.</li><li>Provide only genuine government-issued identity information requested by HUNAR's verification process.</li><li>Do not upload another person's identity document or selfie.</li><li>Verification may be reviewed by authorized HUNAR administrators and may remain pending until reviewed.</li></ul></article><article class="policyCard" id="privacy"><span class="panelKicker">06 · PRIVACY</span><h2>Privacy & Personal Information</h2><ul><li>Only provide information needed for the HUNAR feature you are using.</li><li>Do not publish another person's private information without permission.</li><li>Do not request unnecessary sensitive information from another member.</li><li>Use privacy-conscious language when discussing clients, freelancers, and projects.</li></ul></article><article class="policyCard" id="content"><span class="panelKicker">07 · CONTENT</span><h2>Content & Portfolio Policy</h2><ul><li>Upload work you own or are authorized to show.</li><li>Do not upload malware, deceptive files, stolen content, or unlawful material.</li><li>Portfolio descriptions must accurately represent your work and experience.</li><li>Do not use fake reviews, fake credentials, or fabricated project results.</li></ul></article><article class="policyCard" id="security"><span class="panelKicker">08 · SECURITY</span><h2>Account Security Policy</h2><ul><li>Keep your password private and use a strong password.</li><li>Never give an OTP to another person, including someone claiming to be support.</li><li>Report suspicious account activity as soon as possible.</li><li>Do not attempt to bypass authentication, authorization, rate limits, or security controls.</li></ul></article><article class="policyCard" id="reviews"><span class="panelKicker">09 · REVIEWS</span><h2>Reviews & Reputation</h2><ul><li>Reviews should reflect a genuine work experience.</li><li>No paid, fake, retaliatory, or coordinated reviews.</li><li>Do not threaten another member to obtain a positive review.</li><li>Keep review content factual, relevant, and professional.</li></ul></article><article class="policyCard" id="payments"><span class="panelKicker">10 · PAYMENTS</span><h2>Commercial & Payment Conduct</h2><ul><li>Do not use HUNAR to request or facilitate fraudulent payments.</li><li>Do not misrepresent prices, deliverables, refunds, or commercial terms.</li><li>Keep payment-related agreements clear before work begins.</li><li>Do not pressure another member to reveal payment credentials or authentication information.</li></ul></article><article class="policyCard" id="enforcement"><span class="panelKicker">11 · ENFORCEMENT</span><h2>Reporting & Enforcement</h2><ul><li>HUNAR may review reports and relevant activity to protect users and the platform.</li><li>Violations may result in warnings, message blocking, feature restrictions, suspension, or account action.</li><li>Serious or repeated violations may receive stronger action.</li><li>When reporting an issue, provide the relevant page, account context, and evidence without sharing passwords or OTP codes.</li></ul></article><article class="policyCard" id="disputes"><span class="panelKicker">12 · DISPUTES</span><h2>Professional Dispute Handling</h2><ul><li>Raise disagreements calmly and keep evidence related to the work.</li><li>Do not threaten, harass, or retaliate against another member during a dispute.</li><li>Keep project scope, messages, files, and agreed deliverables available when resolving a disagreement.</li><li>HUNAR may request additional information when reviewing a platform report.</li></ul></article></div><div class="policyNotice"><b>Important:</b> These platform rules are operational HUNAR policies and do not replace applicable Ethiopian law or a separate contract between users.</div><div class="actions"><button class="btn primary" type="button" onclick="copyPolicy()">Copy Policy Summary</button><button class="btn outline" type="button" onclick="go('help')">Back to Help Center</button></div></div></section>`}

function freelancerPerformancePage(){
 if(!me||me.role!=='freelancer'){go('signin');return ''}
 const id=me.id, now=new Date();
 const ownApps=(S.applications||[]).filter(a=>a.uid===id), ownServices=(S.services||[]).filter(x=>x.uid===id), ownPorts=(S.portfolios||[]).filter(x=>x.uid===id), ownReviews=(S.reviews||[]).filter(x=>x.uid===id);
 const completedProjects=(S.projects||[]).filter(p=>p.developer===id&&String(p.status||'').toLowerCase()==='completed');
 const activeProjects=(S.projects||[]).filter(p=>p.developer===id&&['hired','in_progress','submitted','revision_requested'].includes(String(p.status||'').toLowerCase()));
 const sentMessages=(S.messages||[]).filter(m=>m.from===id);
 const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
 const inWindow=(date,n)=>{if(!date)return false;const d=new Date(date);return !isNaN(d)&&d>=daysAgo(n)};
 const countWindow=(arr,n,key='created_at')=>arr.filter(x=>inWindow(x[key],n)).length;
 const completedValue=completedProjects.reduce((sum,p)=>sum+Number(p.budgetMax||p.budgetMin||0),0);
 const buckets=[7,30,90];
 const app7=countWindow(ownApps,7),app30=countWindow(ownApps,30),app90=countWindow(ownApps,90);
 const review7=countWindow(ownReviews,7),review30=countWindow(ownReviews,30),review90=countWindow(ownReviews,90);
 const project7=countWindow(completedProjects,7),project30=countWindow(completedProjects,30),project90=countWindow(completedProjects,90);
 const maxBar=Math.max(1,app7,app30,app90,review7,review30,review90,project7,project30,project90);
 const bar=(label,value)=>`<div class="perfBar"><div class="perfBarHead"><span>${label}</span><b>${value}</b></div><div class="perfBarTrack"><i style="width:${Math.round((value/maxBar)*100)}%"></i></div></div>`;
 const metric=(label,value,note)=>`<div class="perfMetric"><span>${label}</span><strong>${value}</strong><small>${note}</small></div>`;
 const unavailable=(label,note)=>`<div class="perfMetric perfUnavailable"><span>${label}</span><strong>—</strong><small>${note}</small></div>`;
 return `<section class="performancePage"><div class="container">
  <div class="perfHero"><div><span class="tag">FREELANCER PERFORMANCE</span><h1>Understand your work at a glance.</h1><p>Track the activity HUNAR actually has for your account. No invented views, earnings, or trend numbers.</p></div><div class="perfHeroOrb"><span>LIVE</span><b>${ownApps.length+ownServices.length+ownPorts.length}</b><small>tracked activity items</small></div></div>
  <div class="perfPeriod" aria-label="Performance periods"><span class="active">Today</span><span>7 days</span><span>30 days</span><span>3 months</span><span>All time</span></div>
  <div class="perfGrid">${metric('Applications',ownApps.length,`${app30} submitted in 30 days`)}${metric('Active projects',activeProjects.length,'Current assigned work')}${metric('Completed projects',completedProjects.length,`${project30} completed in 30 days`)}${metric('Services',ownServices.length,'Published / synced services')}${metric('Portfolio',ownPorts.length,'Published work samples')}${metric('Reviews',ownReviews.length,`${review30} received in 30 days`)}${metric('Messages sent',sentMessages.length,`${countWindow(sentMessages,30)} in 30 days`)}${unavailable('Profile views','View tracking is not available in the current HUNAR data source.')}</div>
  <div class="perfColumns"><section class="perfPanel"><div class="perfHead"><div><span class="eyebrowSmall">ACTIVITY PULSE</span><h2>Applications by period</h2></div><span class="muted">Real submissions</span></div>${bar('Last 7 days',app7)}${bar('Last 30 days',app30)}${bar('Last 3 months',app90)}<div class="perfInsight"><b>${app30?'Momentum is building.':'No application activity yet.'}</b><span>${app30?'Your application history is available from HUNAR records.':'Applications will appear here after you apply to client jobs.'}</span></div></section>
  <section class="perfPanel"><div class="perfHead"><div><span class="eyebrowSmall">DELIVERY</span><h2>Completed work</h2></div><span class="muted">Real project records</span></div>${bar('Last 7 days',project7)}${bar('Last 30 days',project30)}${bar('Last 3 months',project90)}<div class="perfInsight"><b>${completedProjects.length?'Completed work is recorded.':'No completed projects yet.'}</b><span>${completedProjects.length?'Completed project value is shown below; it is not represented as cash earnings.':'Finish client work to build your performance history.'}</span></div></section></div>
  <section class="perfPanel"><div class="perfHead"><div><span class="eyebrowSmall">MONEY</span><h2>Earnings & completed value</h2></div><span class="muted">No fabricated numbers</span></div><div class="moneyGrid">${unavailable('Actual earnings','Payment transaction / payout data is not exposed to this current page.')}${metric('Completed project value',completedValue?money(completedValue):'ETB 0',`${completedProjects.length} completed project${completedProjects.length===1?'':'s'}`)}${unavailable('Profile views','HUNAR does not currently provide a view counter to this interface.')}</div></section>
  <section class="perfPanel"><div class="perfHead"><div><span class="eyebrowSmall">QUALITY SIGNALS</span><h2>Professional health</h2></div><span class="muted">Based on available HUNAR data</span></div><div class="qualityRows"><div><b>Profile completion</b><div class="progress"><i style="width:${completion(id)}%"></i></div><strong>${completion(id)}%</strong></div><div><b>Portfolio coverage</b><div class="progress"><i style="width:${Math.min(100,ownPorts.length*25)}%"></i></div><strong>${ownPorts.length} work sample${ownPorts.length===1?'':'s'}</strong></div><div><b>Client feedback</b><div class="progress"><i style="width:${Math.min(100,ownReviews.length*20)}%"></i></div><strong>${ownReviews.length} review${ownReviews.length===1?'':'s'}</strong></div></div></section>
  <div class="perfNote"><span class="tag">DATA NOTE</span><p>HUNAR currently tracks applications, projects, services, portfolio work, messages, and reviews here. Profile views and actual payout earnings are not available from the existing page data, so they are deliberately shown as unavailable rather than guessed.</p></div>
 </div></section>`;
}

ick="document.getElementById('setLanguage').scrollIntoView({behavior:'smooth'})">Language</button><button onclick="document.getElementById('setSupport').scrollIntoView({behavior:'smooth'})">Support</button></aside><div class="settingsContent"><article id="setGeneral" class="settingsPanel"><div class="panelKicker">01 · GENERAL</div><h2>General</h2><div class="settingGridPro"><div class="settingCardPro"><b>HUNAR account</b><small>Signed in as ${esc(me.email||'your account')}.</small></div><div class="settingCardPro"><b>Marketplace currency</b><small>Prices are displayed in ETB where available.</small></div></div></article><article id="setAccount" class="settingsPanel"><div class="panelKicker">02 · ACCOUNT</div><h2>Account</h2><div class="actions"><button class="btn outline" onclick="go('account')">Account details</button><button class="btn outline" onclick="go('account-edit')">Edit account</button></div></article><article id="setNotify" class="settingsPanel"><div class="panelKicker">03 · NOTIFICATIONS</div><h2>Notifications</h2>${checks.slice(0,5).map(x=>`<label class="switchRow"><span><b>${x[1]}</b><small>Turn this preference on or off.</small></span><input type="checkbox" ${settingState(x[0],x[2])?'checked':''} onchange="setSetting('${x[0]}',this.checked)"></label>`).join('')}</article><article id="setMessages" class="settingsPanel"><div class="panelKicker">04 · MESSAGES</div><h2>Messaging</h2>${checks.slice(5,8).map(x=>`<label class="switchRow"><span><b>${x[1]}</b><small>Control this messaging preference.</small></span><input type="checkbox" ${settingState(x[0],x[2])?'checked':''} onchange="setSetting('${x[0]}',this.checked)"></label>`).join('')}<div class="actions"><button class="btn primary" onclick="go('messages')">Open Messages</button><button class="btn outline" onclick="go('support-chat')">Chat with HUNAR Team</button></div></article><article id="setMarketplace" class="settingsPanel"><div class="panelKicker">05 · MARKETPLACE</div><h2>Discovery</h2><label clas function clientPerformancePage(){
 if(!me||me.role!=='client'){go('signin');return ''}
 const id=me.id;
 const own=(S.projects||[]).filter(p=>String(p.client)===String(id));
 const ownIds=new Set(own.map(p=>String(p.id)));
 const apps=(S.applications||[]).filter(a=>ownIds.has(String(a.projectId)));
 const messages=(S.messages||[]).filter(m=>String(m.to)===String(id)||String(m.from)===String(id));
 const active=own.filter(p=>!['completed','closed','cancelled'].includes(String(p.status||'').toLowerCase())).length;
 const completed=own.filter(p=>String(p.status||'').toLowerCase()==='completed').length;
 const avg=own.length?(apps.length/own.length).toFixed(1):'—';
 const budget=own.reduce((sum,p)=>sum+Number(p.budgetMax||p.budget||p.budget_min_etb||0),0);
 const statusRows=[
  ['Posted',own.filter(p=>['posted','open'].includes(String(p.status||'').toLowerCase())||!p.status).length],
  ['Active',active],
  ['Completed',completed]
 ];
 return `<section class="section pageEnter clientPerformancePage"><div class="container">
  <div class="performanceHero"><div><span class="tag">CLIENT WORKSPACE</span><h1>Performance</h1><p class="sectionLead">A simple view of your real HUNAR activity.</p></div><div class="performanceMotion"><div class="performanceCore">H</div><i></i><span>CLIENT</span></div></div>
  <div class="grid4 performanceStats"><div class="stat"><b>My Projects</b><h2>${own.length}</h2><span class="muted">Projects you created</span></div><div class="stat"><b>Applications</b><h2>${apps.length}</h2><span class="muted">Freelancer applications</span></div><div class="stat"><b>Active</b><h2>${active}</h2><span class="muted">Currently open or active</span></div><div class="stat"><b>Messages</b><h2>${messages.length}</h2><span class="muted">Your message activity</span></div></div>
  <div class="grid2 clientPerformanceGrid"><article class="card"><div class="row"><div><span class="eyebrowSmall">PROJECT HEALTH</span><h2>Project activity</h2></div><span class="badge">${completed}/${own.length} completed</span></div><div class="performanceRows">${statusRows.map(x=>`<div class="performanceRow"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></article>
  <article class="card"><span class="eyebrowSmall">DECISIONS</span><h2>What the numbers mean</h2><p class="muted">You have an average of <b>${avg}</b> applications per project. Use your Applications page to compare freelancers and continue conversations.</p><div class="actions"><button class="btn primary" type="button" onclick="go('client-applications')">Review Applications</button><button class="btn outline" type="button" onclick="go('projects')">My Projects</button></div></article></div>
  <div class="clientPerformanceNote"><div><span class="eyebrowSmall">REAL DATA ONLY</span><h3>${budget?money(budget):'Budget data not available'}</h3><p>Budget total is calculated only from your saved project values. HUNAR does not invent performance numbers.</p></div><button class="btn outline" type="button" onclick="go('dashboard')">Dashboard</button></div>
 </div></section>`;
}

function clientApplicationDetail(id){

  if(!a)return notFound();
  const p=S.projects.find(x=>String(x.id)===String(a.projectId));
  if(!p||String(p.client)!==String(me.id))return denied();
  const nameOf=uid=>{const u=(S.users||[]).find(x=>String(x.id)===String(uid));const pr=(S.profiles||[]).find(x=>String(x.id)===String(uid));return u?.n||pr?.name||'Freelancer'};
  const freelancer=nameOf(a.uid);
  const portfolioIds=Array.isArray(a.portfolioIds)?a.portfolioIds:[];

}
function notifications(){if(!me){go('signin');return ''}const items=(S.notifications||[]).filter(n=>n.to===me.id);const openNotification=async n=>{try{await HunarData.notifications.markRead(n.id);n.read=true}catch(e){}const type=String(n.type||'').toLowerCase();if(type.includes('application')){go(me.role==='client'?'client-applications':'applications');return}if(type.includes('message')){go('messages');return}go('notifications')};return `<section class="section pageEnter"><div class="container notificationPage"><div class="row"><div><span class="tag">NOTIFICATIONS</span><h1>Your notifications</h1><p class="sectionLead">Important updates about your HUNAR activity.</p></div><button class="btn outline" type="button" onclick="markNotificationsRead()">Mark all as read</button></div><div style="margin-top:20px">${items.length?items.map(n=>`<button type="button" class="notificationItem ${n.read?'':'unread'}" onclick="openHunarNotification('${esc(n.id)}')"><div class="notificationIcon">${n.read?'✓':'•'}</div><div><b>${esc(n.title||'HUNAR update')}</b><p class="muted" style="margin:4px 0">${esc(n.text||n.body||n.message||'You have a new HUNAR update.')}</p><small class="muted">${esc(n.created_at||n.created||n.at||'Recent')} · Open →</small></div></button>`).join(''):'<article class="infoSection"><h2>You are all caught up.</h2><p class="muted">New HUNAR notifications will appear here.</p></article>'}</div></div></section>`}
async function markNotificationsRead(){if(!me)return;const items=(S.notifications||[]).filter(x=>x.to===me.id);for(const x of items){x.read=true;try{await HunarData.notifications.markRead(x.id)}catch(e){}}render('notifications')}
async function openHunarNotification(id){const n=(S.notifications||[]).find(x=>String(x.id)===String(id));if(!n)return;try{await HunarData.notifications.markRead(n.id)}catch(e){}n.read=true;const type=String(n.type||'').toLowerCase();go(type.includes('application')?(me?.role==='client'?'client-applications':'applications'):type.includes('message')?'messages':'notifications')}

function backSafe(){
  const raw=location.hash.slice(1),route=(raw.split('?')[0]||'home');
  if(route==='register'){
    const qs=new URLSearchParams(raw.split('?')[1]||''),role=qs.get('role')||sessionStorage.getItem('hunar_signup_role')||signupRole||'client',step=Number(qs.get('step')||1);
    if(step>1){go('register?role='+encodeURIComponent(role)+'&step='+(step-1));return}
  }
  try{
    const stack=JSON.parse(sessionStorage.getItem('hunar_app_history')||'[]');
    const blocked=new Set(['home','signup','signin','forgot-password','reset-password','google-role','auth-callback']);
    while(stack.length){
      const previous=stack.pop(),previousRoute=String(previous||'').split('?')[0];
      if(!previous||blocked.has(previousRoute)||previous===raw)continue;
      sessionStorage.setItem('hunar_app_history',JSON.stringify(stack));
      location.hash=previous;return;
    }
    sessionStorage.setItem('hunar_app_history','[]');
  }catch(e){}
  // Never force an authenticated user to a public page. Stay in the inner workspace.
  const fallback=me?'dashboard':'home';
  location.hash=fallback;
}

async function postProject(e){
  e.preventDefault();
  if(!me||me.role!=='client'){go('signin?role=client');return}
  if(!productionUser){alert('Please sign in with a real HUNAR account.');return}
  const form=e.target;
  if(form.dataset.submitting==='1')return;
  const f=new FormData(form);
  const title=String(f.get('title')||'').trim(),description=String(f.get('desc')||'').trim();
  const minRaw=String(f.get('min')||'').trim(),maxRaw=String(f.get('max')||'').trim();
  const min=minRaw?Number(minRaw):null,max=maxRaw?Number(maxRaw):null;
  if(title.length<3){alert('Please enter a project title.');return}
  if(description.length<20){alert('Please add a little more detail to the project description.');return}
  if(min!==null&&(!Number.isFinite(min)||min<0)){alert('Please enter a valid minimum budget.');return}
  if(max!==null&&(!Number.isFinite(max)||max<0)){alert('Please enter a valid maximum budget.');return}
  if(min!==null&&max!==null&&min>max){alert('Minimum budget cannot exceed maximum budget.');return}
  form.dataset.submitting='1';
  const btn=form.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Posting…'}
  const data={title,category:String(f.get('category')||''),budget_min_etb:min,budget_max_etb:max,deadline:String(f.get('deadline')||'')||null,skills:String(f.get('skills')||'').split(',').map(x=>x.trim()).filter(Boolean),description,status:'posted'};
  try{await HunarData.projects.create(data);await syncProductionData();go('projects')}catch(err){console.error('HUNAR project post:',err);alert(String(err?.message||err||'Project could not be posted.'))}
  finally{form.dataset.submitting='0';if(btn){btn.disabled=false;btn.textContent='Post Project →'}}
}

async function submitApplication(e,id){
  e.preventDefault();
  if(!me||me.role!=='freelancer'){go('signin?role=freelancer');return}
  if(!productionUser){alert('Please sign in with a real Hunar account to apply.');return}
  const p=S.projects.find(x=>String(x.id)===String(id));
  if(!p||String(id).length<20){alert('This is demo content. Apply to a real posted HUNAR project.');return}
  const fd=new FormData(e.target),title=String(fd.get('title')||'').trim(),cover=String(fd.get('cover')||'').trim(),price=Number(fd.get('price')||0),days=Number(fd.get('days')||0),portfolios=fd.getAll('portfolio');
  if(title.length<3){alert('Please enter an application title.');return}
  if(cover.length<40){alert('Please write at least 40 characters in your cover letter.');return}
  if(cover.length>2000){alert('Please keep your cover letter under 2,000 characters.');return}
  if(!Number.isFinite(price)||price<=0){alert('Please enter a valid proposed price.');return}
  if(!Number.isFinite(days)||days<=0){alert('Please enter a valid delivery time.');return}
  const submitBtn=e.target.querySelector('button[type=submit]');if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Sending…'}
  try{
    await HunarData.applications.create({project_id:id,title,cover_letter:cover,proposed_price_etb:price,delivery_days:days},portfolios);
    await syncProductionData();
    go('applications');
  }catch(err){
    console.error('HUNAR application submit:',err);
    const msg=String(err?.message||err||'');
    if(/applications_cover_letter_check/i.test(msg))alert('The cover letter was rejected by the database. The HUNAR database fix must be applied once in Supabase.');
    else alert(msg||'Application could not be submitted.');
  }finally{if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Submit Application →'}}
}

<script>
(function(){
  const scene=document.querySelector('.hero .scene');
  if(!scene || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const visual=scene.closest('.heroVisual');
  let tx=0,ty=0,cx=0,cy=0,raf=0;
  function frame(){
    cx+=(tx-cx)*0.06; cy+=(ty-cy)*0.06;
    scene.style.transform='rotateY('+(-7+cx*5)+'deg) rotateX('+(4+cy*4)+'deg)';
    raf=requestAnimationFrame(frame);
  }
  visual.addEventListener('pointermove',function(e){
    const r=visual.getBoundingClientRect();
    tx=(e.clientX-r.left)/r.width-.5;
    ty=(e.clientY-r.top)/r.height-.5;
    if(!raf) raf=requestAnimationFrame(frame);
  });
  visual.addEventListener('pointerleave',function(){tx=0;ty=0});
  frame();
})();
</script>
<script>
(function(){
  function initHunarVisualLayer(){
    if(document.querySelector('.hunar-fx-layer')) return;
    const layer=document.createElement('div');
    layer.className='hunar-fx-layer';
    layer.setAttribute('aria-hidden','true');
    layer.innerHTML='<div class="hunar-fx-grid"></div><div class="hunar-fx-orb a"></div><div class="hunar-fx-orb b"></div><div class="hunar-fx-orb c"></div><div class="hunar-fx-ring"></div>';
    document.body.prepend(layer);

    let mx=0,my=0,tx=0,ty=0;
    window.addEventListener('pointermove',function(e){
      tx=(e.clientX/window.innerWidth-.5)*18;
      ty=(e.clientY/window.innerHeight-.5)*18;
    },{passive:true});
    function frame(){
      mx += (tx-mx)*.055; my += (ty-my)*.055;
      const a=layer.querySelector('.a'),b=layer.querySelector('.b'),c=layer.querySelector('.c'),r=layer.querySelector('.hunar-fx-ring');
      if(a)a.style.transform='translate3d('+mx*.65+'px,'+my*.65+'px,0) rotateX('+(-my*.45)+'deg) rotateY('+(mx*.5)+'deg)';
      if(b)b.style.transform='translate3d('+mx*.95+'px,'+my*.9+'px,0) rotateX('+(my*.55)+'deg) rotateY('+(-mx*.65)+'deg)';
      if(c)c.style.transform='translate3d('+mx*1.2+'px,'+my*1.15+'px,0) rotateX('+(-my*.8)+'deg) rotateY('+(mx*.9)+'deg)';
      if(r)r.style.marginLeft=(mx*.7)+'px';
      requestAnimationFrame(frame);
    }
    frame();

    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function decorate(){
      const app=document.getElementById('app');
      if(!app)return;
      app.classList.add('hunar-page-shell');
      app.querySelectorAll('h1,h2,h3,.section-title,.page-title').forEach(function(el){el.classList.add('hunar-reveal')});
      app.querySelectorAll('.card,.service,.devcard,.project,.profile-card,.result-card,.stat,.panel,.box,.item,.tile').forEach(function(el){
        el.classList.add('hunar-depth','hunar-reveal');
      });
      if(reduce)return;
      app.querySelectorAll('.hunar-depth').forEach(function(el){
        if(el.dataset.hunarTilt)return;
        el.dataset.hunarTilt='1';
        el.addEventListener('pointermove',function(e){
          const r=el.getBoundingClientRect();
          const ry=((e.clientX-r.left)/r.width-.5)*5;
          const rx=-((e.clientY-r.top)/r.height-.5)*5;
          el.style.setProperty('--rx',rx.toFixed(2)+'deg');
          el.style.setProperty('--ry',ry.toFixed(2)+'deg');
        });
        el.addEventListener('pointerleave',function(){el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')});
      });
      const obs=new IntersectionObserver(function(entries){entries.forEach(function(x){if(x.isIntersecting)x.target.classList.add('is-visible')})},{threshold:.08});
      app.querySelectorAll('.hunar-reveal').forEach(function(el){obs.observe(el)});
    }
    decorate();
    const originalRender=window.render;
    if(typeof originalRender==='function'){
      window.render=function(){
        const out=originalRender.apply(this,arguments);
        setTimeout(decorate,40);
        setTimeout(decorate,250);
        return out;
      };
    }
    window.addEventListener('hashchange',function(){setTimeout(decorate,80)});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initHunarVisualLayer);else initHunarVisualLayer();
})();
</script>
<script>
(function(){
  function initDragOrb(){const orb=document.querySelector('.hunar-drag-orb');if(!orb||orb.dataset.bound)return;orb.dataset.bound='1';let down=false,sx=0,sy=0,ox=0,oy=0;const parent=orb.parentElement;orb.addEventListener('pointerdown',e=>{down=true;orb.setPointerCapture?.(e.pointerId);const r=orb.getBoundingClientRect(),pr=parent.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left-pr.left;oy=r.top-pr.top;orb.style.animation='none'});orb.addEventListener('pointermove',e=>{if(!down)return;const pr=parent.getBoundingClientRect();let x=ox+(e.clientX-sx),y=oy+(e.clientY-sy);x=Math.max(0,Math.min(pr.width-orb.offsetWidth,x));y=Math.max(0,Math.min(pr.height-orb.offsetHeight,y));orb.style.left=x+'px';orb.style.top=y+'px';orb.style.right='auto'});orb.addEventListener('pointerup',()=>{down=false});orb.addEventListener('pointercancel',()=>{down=false})}
  function bind(){initDragOrb();}
  const oldRender=window.render;if(typeof oldRender==='function'){window.render=function(){const out=oldRender.apply(this,arguments);setTimeout(bind,50);return out}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();window.addEventListener('hashchange',()=>setTimeout(bind,80));
})();
</script></body>
