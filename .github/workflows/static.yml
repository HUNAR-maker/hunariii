# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject HUNAR session and mobile profile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<script src="\./hunar-session-policy\.js\?v=\d+"></script>', '<script src="./hunar-session-policy.js?v=3"></script>', s, count=1)
          if 'hunar-session-policy.js?v=3' not in s:
              marker='<script src="hunar-safety.js?v=1"></script>'
              if marker not in s: raise SystemExit('Missing HUNAR safety script insertion point')
              s=s.replace(marker,marker+'\n<script src="./hunar-session-policy.js?v=3"></script>',1)
          live='<script src="./hunar-live-fixes.js?v=3"></script>'
          s=re.sub(r'<script src="\./hunar-live-fixes\.js(?:\?v=\d+)?"></script>', live, s, count=1)
          if live not in s:
              s=s.replace('</body>',live+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('HUNAR session policy v3 and mobile profile UI v3 injected.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
